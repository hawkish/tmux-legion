name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.envrc'
      # Release tooling: it never enters the build, and `make release` refuses
      # to publish a commit origin/main hasn't got, so CI still gates releases.
      - 'Makefile'
      - '.github/release-notes/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.envrc'
      - 'Makefile'
      - '.github/release-notes/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build
        run: nix build --print-build-logs
      - name: Test and lint
        # Single devShell invocation: each `nix develop` pays a flake eval.
        run: |
          nix develop --command bash -euc '
            cargo test
            cargo clippy --all-targets -- -D warnings
            cargo fmt --check
          '
